# The web image: serves the static app and, locally, plays the part of the load balancer by sending
# each /api/v1/<service>/ path to its service. In AWS the ALB does the routing and CloudFront
# serves the files, so only the static part of this file is used there.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Used by the container health check.
  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  # Hashed build files never change, so the browser may keep them for a year.
  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/v1/identity/     { proxy_pass http://identity:3000; }
  location /api/v1/habit/        { proxy_pass http://habit:3000; }
  location /api/v1/event-tracking/ { proxy_pass http://event-tracking:3000; }
  location /api/v1/challenge/    { proxy_pass http://challenge:3000; }
  location /api/v1/insight/      { proxy_pass http://insight:3000; }
  location /api/v1/notification/ { proxy_pass http://notification:3000; }

  # Every page is the same single index.html; the browser's router shows the right screen. It must
  # not be cached, or a new release would not reach people.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
